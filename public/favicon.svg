<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Monograma "rs" — el mismo de la sidebar, para que la pestaña y la marca
    del sitio coincidan. Colores tomados de los tokens de src/styles/global.css:
    fondo --color-surface (#1a1d24), borde --color-line (#2b303b),
    letras --color-accent (#88c0d0).

    Fondo a sangre en vez del recuadro con aire de la sidebar: a 16 px el
    padding se come los píxeles útiles y el monograma deja de leerse.
  -->
  <rect width="64" height="64" fill="#1a1d24" />
  <rect x="0.5" y="0.5" width="63" height="63" fill="none" stroke="#2b303b" />
  <text
    x="32"
    y="33"
    fill="#88c0d0"
    font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace"
    font-size="38"
    font-weight="600"
    letter-spacing="-1"
    text-anchor="middle"
    dominant-baseline="central"
  >rs</text>
</svg>
