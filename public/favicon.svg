<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Monograma "rs" en blanco sobre el color de texto del sitio (#1a1a1a): se
    lee igual con la pestaña en claro o en oscuro. Ojo: en un comentario
    XML no puede haber dos guiones seguidos, rompen el SVG entero.
    "rs" no tiene ascendentes ni descendentes, así que se centra por la altura
    de la x: la línea base va media altura de x por debajo del centro.
  -->
  <rect width="64" height="64" fill="#1a1a1a" />
  <text
    x="32"
    y="43"
    fill="#ffffff"
    font-family="system-ui, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="-1.5"
    text-anchor="middle"
  >rs</text>
</svg>
