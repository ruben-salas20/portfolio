<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three ways to cut a sentence</title>
<link rel="stylesheet" href="/articulos/artefactos.css">
<style>
  /* English version of cortar.html: same code, translated text.
     Un solo espacio entre bloques (16 px) y otro dentro de cada bloque
     (6 px): con márgenes sueltos cada hueco salía de un tamaño. */
  body {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  body > * { margin: 0; }
  /* artefactos.css le da a .field su propio margen de 16 px, que se sumaría
     al gap. */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0;
  }
  /* field-sizing: el cuadro mide lo que su texto, sin una línea vacía
     debajo. Donde no existe, se queda en una línea y se puede estirar. */
  textarea {
    box-sizing: border-box;
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--control);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    field-sizing: content;
    resize: vertical;
  }
  /* «Cortar en» a la izquierda de los botones, en la misma línea. */
  .mode {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    color: var(--muted);
    font-size: 0.875rem;
  }
  .pieces {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .piece {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    white-space: pre;
  }
  /* El ␣ va en el color del texto, más tenue: --muted se perdía sobre los
     fondos de color. */
  .space { opacity: 0.6; }
  /* El texto pasa AA (4.5:1) sobre cada fondo: de 9.4:1 a 12.4:1 en claro y
     de 4.9:1 a 5.8:1 en oscuro. Si cambias uno, vuelve a medir. */
  .c0 { background: light-dark(#93c5fd, #1d4ed8); }
  .c1 { background: light-dark(#86efac, #166534); }
  .c2 { background: light-dark(#fcd34d, #854d0e); }
  .c3 { background: light-dark(#f9a8d4, #be185d); }
  .c4 { background: light-dark(#c4b5fd, #6d28d9); }
  .result {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .big { line-height: 1.1; }
  p { margin: 0; font-size: 0.875rem; }
</style>
</head>
<body>
  <label class="field">Write anything you want
    <textarea id="text" rows="1">El uno es indiscutiblemente menor que el dos.</textarea>
  </label>
  <div class="mode">
    <span id="mode-label">Cut into</span>
    <div class="options" role="radiogroup" aria-labelledby="mode-label">
      <label><input type="radio" name="mode" value="letters"><span>Letters</span></label>
      <label><input type="radio" name="mode" value="words"><span>Words</span></label>
      <label><input type="radio" name="mode" value="tokens" checked><span>Tokens</span></label>
    </div>
  </div>
  <div id="pieces" class="pieces"></div>
  <div class="result">
    <output id="count" class="big"></output>
    <p class="muted">These are the tokens of the GPT-5 tokenizer.</p>
  </div>
<script src="tokenizador.js"></script>
<script>
  const text = document.getElementById('text');
  const piecesEl = document.getElementById('pieces');

  function cut(value, mode) {
    if (mode === 'letters') {
      return [...value];
    }
    if (mode === 'words') {
      return value.split(/\s+/).filter(Boolean);
    }
    return window.tokenizer.encode(value).map((id) => window.tokenizer.decode([id]));
  }

  const names = { letters: ['letter', 'letters'], words: ['word', 'words'], tokens: ['token', 'tokens'] };

  function update() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const pieces = cut(text.value, mode);
    piecesEl.replaceChildren(...pieces.map((p, i) => {
      const el = document.createElement('span');
      el.className = `piece c${i % 5}`;
      for (const part of p.split(/( )/)) {
        if (!part) continue;
        const s = document.createElement('span');
        if (part === ' ') { s.className = 'space'; s.textContent = '␣'; } else { s.textContent = part; }
        el.append(s);
      }
      return el;
    }));
    const [one, many] = names[mode];
    document.getElementById('count').textContent = `${pieces.length} ${pieces.length === 1 ? one : many}`;
  }

  text.addEventListener('input', update);
  document.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener('change', update));
  update();
</script>
</body>
</html>
